
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อความลับ 💙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  color: white;
  background: linear-gradient(160deg, #10213c, #203b5a);
  overflow: hidden;
}

.heart {
  position: absolute;
  font-size: 30px;
  opacity: 0.7;
}

.h1 { top: 10%; left: 8%; }
.h2 { bottom: 12%; right: 10%; }
.h3 { top: 25%; right: 12%; }

.card {
  width: 92%;
  max-width: 420px;
  padding: 35px 22px;
  text-align: center;
  border-radius: 30px;
  background: #243e5c;
  border: 4px solid #416587;
  box-shadow: 0 10px 0 #345778;
}

.lock {
  font-size: 55px;
}

h2 {
  font-size: 27px;
  margin: 12px 0;
}

p {
  color: #b8d7ef;
}

input {
  width: 70px;
  height: 85px;
  margin: 20px 5px;
  text-align: center;
  font-size: 30px;
  color: white;
  background: #1b324d;
  border: 3px solid #416587;
  border-radius: 20px;
}

button {
  display: block;
  margin: 20px auto 0;
  padding: 15px 35px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  background: #8bd0f7;
  color: #142c46;
  cursor: pointer;
}

#message {
  display: none;
  font-size: 20px;
  line-height: 1.9;
  white-space: pre-line;
}

#wrong {
  color: #ffb5c5;
}
</style>
</head>

<body>

<div class="heart h1">☁️</div>
<div class="heart h2">💙</div>
<div class="heart h3">✨</div>

<div class="card" id="box">

  <div class="lock">🔐</div>

  <h2>ใส่รหัส 2 หลักนะ</h2>
  <p>พิมพ์ตัวเลขเพื่อเปิดอ่านข้อความ</p>

  <div id="form">
    <input id="pass1" type="password"
           maxlength="1" inputmode="numeric">
    <input id="pass2" type="password"
           maxlength="1" inputmode="numeric">

    <p id="wrong"></p>

    <button onclick="unlock()">
      เปิดอ่านเลย
    </button>
  </div>

  <div id="message"></div>

</div>

<script>
const password = "13";


const secretMessage = `คือจริงใช่ไหม คือเมื่อวานก่อนอะเค้าบ่นกับพ่อแม่ว่า เค้าอยากได้รถ และที่นี่พ่อแม่เค้าก็พูดว่า “เดี๋ยวพรุ่งนี้พาไปซื้อรถนะ” และวันนี้เค้าก็มาซื้อรถจริงๆ มีหลายคันมาก เลือกไม่ถูกเลยแหละ แบบมันหลายคันจริงๆ แต่เค้ามีคันที่ชอบนะ คันถึงเธอทุกวิด

“คิดถึงเธอทุกวัน” >< 💙`;


function unlock() {
  const p1 = document.getElementById("pass1").value;
  const p2 = document.getElementById("pass2").value;

  if (p1 + p2 === password) {
    document.getElementById("form").style.display = "none";
    document.getElementById("message").style.display = "block";
    document.getElementById("message").innerText = secretMessage;
    document.getElementById("box").style.padding = "35px 22px";
  } else {
    document.getElementById("wrong").innerText =
      "รหัสไม่ถูกนะ ลองใหม่อีกครั้ง 💗";
  }
}
</script>

</body>
</html>
